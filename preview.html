const STORAGE_KEY = 'frnyc_progress_preview'

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY)
    if (raw) return JSON.parse(raw)
  } catch(e) {}
  return {
    onboarded: false,
    role: 'counselor',
    schoolName: '',
    completedMissions: [],
    missionStepProgress: {},
    earnedBadges: [],
    streak: 0,
    lastActive: '',
    phase: 'awareness',
    focusMode: false,
  }
}

function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)) }

let STATE = loadState()
let CURRENT_PAGE = STATE.onboarded ? 'dashboard' : 'welcome'
let CURRENT_MISSION_ID = null
let ONBOARD_STEP = 1
let ONBOARD_ROLE = null
let ONBOARD_SCHOOL = ''
let CELEBRATION_MISSION = null

function setState(updater) {
  STATE = updater(STATE)
  saveState(STATE)
  render()
}

// ═══════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════

function getMissionStatus(mId) {
  if (STATE.completedMissions.includes(mId)) return 'completed'
  const m = MISSIONS.find(x => x.id === mId)
  if (!m) return 'locked'
  const depsOk = (m.dependsOn || []).every(d => STATE.completedMissions.includes(d))
  if (!depsOk) return 'locked'
  if ((STATE.missionStepProgress[mId] || 0) > 0) return 'in-progress'
  return 'not-started'
}

function getStatusPill(status, size='sm') {
  const cfg = {
    locked:       {label:'Locked',      cls:'bg-gray-100 text-gray-400'},
    'not-started':{label:'Not Started', cls:'bg-amber-50 text-amber-700 border border-amber-200'},
    'in-progress':{label:'In Progress', cls:'bg-blue-50 text-blue-700 border border-blue-200'},
    completed:    {label:'Complete',    cls:'bg-emerald-50 text-emerald-700 border border-emerald-200'},
  }
  const {label,cls} = cfg[status] || cfg.locked
  const sz = size === 'sm' ? 'text-[10px] px-2 py-0.5' : 'text-xs px-3 py-1'
  return `<span class="inline-flex items-center rounded-full font-head font-bold uppercase tracking-wide ${sz} ${cls}">${label}</span>`
}

function getPhase(id) { return PHASES.find(p=>p.id===id) || PHASES[0] }
function getRole(id) { return ROLES.find(r=>r.id===id) || ROLES[1] }

function progressBar(pct, color='#0F3460', h=6) {
  return `<div class="progress-bar" style="height:${h}px"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>`
}

function completionRing(done, max, size=72, color='#0F3460') {
  max = Math.max(max,1)
  const pct = Math.min(100, (done/max)*100)
  const r = (size-6)/2, circ = 2*Math.PI*r, off = circ*(1-pct/100)
  return `<div style="position:relative;width:${size}px;height:${size}px;display:inline-flex;align-items:center;justify-content:center">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="6"
        stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round" style="transition:stroke-dashoffset 0.8s ease-out"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <span style="font-size:12px;font-weight:700;font-family:Montserrat,sans-serif;color:${color}">${Math.round(pct)}%</span>
    </div>
  </div>`
}

        <h2 style="font-size:clamp(1.5rem,4vw,2rem);font-family:Montserrat,sans-serif;font-weight:900;color:#fff;margin-bottom:10px;line-height:1.2">${focusMission.title}</h2>

  <div style="max-width:900px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:20px" class="fade-in">

    <!-- Welcome banner -->

    <!-- Focus mission -->
    ${focusMission ? `

          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;border-radius:8px;border:${p.id===STATE.phase?`2px solid ${p.color}`:'1px solid #E5E7EB'};background:${p.id===STATE.phase?p.bg:i<phaseIdx?'#F0FDF4':'#FAFAFA'}">
              <div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:Montserrat,sans-serif;font-weight:800;background:${p.id===STATE.phase?p.color:i<phaseIdx?'#059669':'#E5E7EB'};color:${p.id===STATE.phase||i<phaseIdx?'#fff':'#9CA3AF'}">
                ${i<phaseIdx?'✓':p.letter}
              </div>
              <span style="font-size:9px;font-family:Montserrat,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:${p.id===STATE.phase?p.color:'#9CA3AF'}">${p.label}</span>

function missionCard(m, compact=false) {
  const status = getMissionStatus(m.id)
  const phase = getPhase(m.phase)
  const stepProg = STATE.missionStepProgress[m.id] || 0
  const pct = m.steps.length > 0 ? Math.round((stepProg/m.steps.length)*100) : 0
  const isLocked = status === 'locked'
  return `
  <div onclick="${isLocked?'':'navToMission(\''+m.id+'\')'}" style="background:#fff;border-radius:12px;border:1px solid #DDE3EE;padding:${compact?'14px':'18px'};cursor:${isLocked?'not-allowed':'pointer'};opacity:${isLocked?0.5:1};transition:all 0.15s;box-shadow:0 2px 8px rgba(15,52,96,0.06)" onmouseover="${isLocked?'':'this.style.boxShadow=\'0 6px 24px rgba(15,52,96,0.12)\';this.style.transform=\'translateY(-2px)\'"}" onmouseout="this.style.boxShadow='0 2px 8px rgba(15,52,96,0.06)';this.style.transform='none'">

          style="flex:1;border:1px solid #E5E7EB;border-radius:8px;padding:10px 12px;font-size:13px;font-family:Inter,sans-serif;outline:none"
          onfocus="this.style.borderColor='#0F3460'" onblur="this.style.borderColor='#E5E7EB'" />
        <button onclick="updateSchoolName()" style="background:#0F3460;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:12px;font-family:Montserrat,sans-serif;font-weight:700;cursor:pointer">Save</button>
      </div>
    </div>

    <!-- Role -->
    <div class="card" style="padding:18px">
      <p style="font-size:9px;font-family:Montserrat,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#9CA3AF;margin-bottom:10px">Your Role</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">
        ${ROLES.map(r=>`
        <button onclick="updateRole('${r.id}')" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;border:2px solid ${STATE.role===r.id?r.color:'#E5E7EB'};background:${STATE.role===r.id?r.color+'0D':'#fff'};cursor:pointer;text-align:left">
          <span style="font-size:18px">${r.icon}</span>
          <p style="font-size:12px;font-family:Montserrat,sans-serif;font-weight:700;color:#111827;flex:1">${r.title}</p>
          ${STATE.role===r.id?`<span style="font-size:11px;color:${r.color}">✓</span>`:''}
        </button>`).join('')}
      </div>
    </div>

    <!-- Phase -->
    <div class="card" style="padding:18px">
      <p style="font-size:9px;font-family:Montserrat,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#9CA3AF;margin-bottom:6px">Current Framework Phase</p>
      <p style="font-size:11px;color:#9CA3AF;margin-bottom:10px">Update to reflect where your school is in the FRNYC cycle.</p>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${PHASES.map(p=>`
        <button onclick="updatePhase('${p.id}')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:2px solid ${STATE.phase===p.id?p.color:'#E5E7EB'};background:${STATE.phase===p.id?p.bg:'#fff'};cursor:pointer;text-align:left">
          <div style="width:26px;height:26px;border-radius:50%;background:${p.color};display:flex;align-items:center;justify-content:center;font-size:11px;font-family:Montserrat,sans-serif;font-weight:800;color:#fff;flex-shrink:0">${p.letter}</div>
          <div>
            <p style="font-size:12px;font-family:Montserrat,sans-serif;font-weight:700;color:#111827">${p.label}</p>
            <p style="font-size:10px;color:#6B7280">${p.description}</p>
          </div>
          ${STATE.phase===p.id?`<span style="margin-left:auto;color:${p.color}">✓</span>`:''}
        </button>`).join('')}
      </div>
    </div>

    <!-- Reset -->
    <div class="card" style="padding:18px">
      <p style="font-size:9px;font-family:Montserrat,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#9CA3AF;margin-bottom:6px">Reset Progress</p>
      <p style="font-size:11px;color:#6B7280;margin-bottom:12px">Clears all mission progress, badges, and settings. Use for testing or handing off to a new user.</p>
      <button onclick="if(confirm('Reset all progress? This cannot be undone.'))resetAll()" style="border:1px solid rgba(181,22,43,0.3);color:#B5162B;background:none;border-radius:8px;padding:8px 16px;font-size:11px;font-family:Montserrat,sans-serif;font-weight:700;cursor:pointer">Reset all progress</button>
    </div>
  </div>`)
}

function renderTeamView() {
  const phaseProgress = PHASES.map(p=>{
    const pm = MISSIONS.filter(m=>m.phase===p.id)
    const done = pm.filter(m=>STATE.completedMissions.includes(m.id)).length
    return {phase:p, total:pm.length, done, pct:pm.length>0?Math.round((done/pm.length)*100):0}
  })
  const overall = Math.round((STATE.completedMissions.length/MISSIONS.length)*100)

  const mockTeam = [
    {name:'Valeria Reyes',        role:'counselor',         done:2, initials:'VR'},
    {name:'James Obi',            role:'pathway-teacher',   done:1, initials:'JO'},
    {name:'Carmen Diaz',          role:'family-engagement', done:0, initials:'CD'},
    {name:'Principal T. Washington',role:'principal',       done:1, initials:'TW'},
  ]

  return renderAppShell(`
  <div style="max-width:900px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:20px" class="fade-in">
    <div>
      <h2 style="font-size:20px;font-family:Montserrat,sans-serif;font-weight:900;color:#111827;margin-bottom:4px">Team View</h2>
      <p style="font-size:13px;color:#6B7280">${STATE.schoolName?STATE.schoolName+' — ':''}School-wide mission progress.</p>
    </div>

    <!-- School health -->
    <div style="background:#0F3460;border-radius:12px;padding:20px 24px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px">
        <div>
          <p style="color:#F5C518;font-size:9px;font-family:Montserrat,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px">School Progress</p>
          <p style="font-size:15px;font-family:Montserrat,sans-serif;font-weight:800;color:#fff">${STATE.completedMissions.length} of ${MISSIONS.length} missions complete</p>
        </div>
        <p style="font-size:36px;font-family:Montserrat,sans-serif;font-weight:900;color:#F5C518">${overall}%</p>
      </div>
      ${progressBar(overall,'#F5C518',8)}
    </div>

    <!-- Phase grid -->
    <div>
      <p style="font-size:10px;font-family:Montserrat,sans-serif;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px">Progress by Phase</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">
        ${phaseProgress.map(({phase,total,done,pct})=>`
        <div style="border-radius:10px;border:1px solid ${phase.color}25;background:${phase.bg};padding:12px;text-align:center">
          <div style="width:30px;height:30px;border-radius:50%;background:${phase.color};display:flex;align-items:center;justify-content:center;font-size:12px;font-family:Montserrat,sans-serif;font-weight:800;color:#fff;margin:0 auto 6px">${phase.letter}</div>
          <p style="font-size:10px;font-family:Montserrat,sans-serif;font-weight:700;color:${phase.color}">${phase.label}</p>
          <p style="font-size:18px;font-family:Montserrat,sans-serif;font-weight:900;color:${phase.color};margin:2px 0">${pct}%</p>
          <p style="font-size:9px;color:#9CA3AF">${done}/${total}</p>
        </div>`).join('')}
      </div>
    </div>

    <!-- Mission table -->
    <div>
      <p style="font-size:10px;font-family:Montserrat,sans-serif;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px">All Missions</p>
      <div class="card" style="overflow:hidden">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="background:#F9FAFB;border-bottom:1px solid #F3F4F6">
              <th style="text-align:left;padding:10px 14px;font-size:9px;font-family:Montserrat,sans-serif;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.1em">Mission</th>
              <th style="text-align:left;padding:10px 14px;font-size:9px;font-family:Montserrat,sans-serif;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.1em">Phase</th>
              <th style="text-align:left;padding:10px 14px;font-size:9px;font-family:Montserrat,sans-serif;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.1em">Status</th>
              <th style="text-align:left;padding:10px 14px;font-size:9px;font-family:Montserrat,sans-serif;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.1em">Owners</th>
            </tr>
          </thead>
          <tbody>
            ${MISSIONS.map((m,i)=>{
              const phase = getPhase(m.phase)
              const status = getMissionStatus(m.id)
              return `<tr style="border-bottom:1px solid #F9FAFB;background:${i%2?'#FAFAFA':'#fff'}">
                <td style="padding:10px 14px">
                  <p style="font-size:12px;font-family:Montserrat,sans-serif;font-weight:600;color:#111827">${m.title}</p>
                  <p style="font-size:10px;color:#9CA3AF">${m.due}</p>
                </td>
                <td style="padding:10px 14px">
                  <span class="pill" style="background:${phase.bg};color:${phase.color}">${phase.label}</span>
                </td>
                <td style="padding:10px 14px">${getStatusPill(status)}</td>
                <td style="padding:10px 14px">
                  <div style="display:flex;gap:4px">${m.owner.slice(0,3).map(id=>{const r=getRole(id);return`<span title="${r.title}" style="font-size:14px">${r.icon}</span>`}).join('')}</div>
                </td>
              </tr>`
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Team roster -->
    <div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <p style="font-size:10px;font-family:Montserrat,sans-serif;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:0.1em">Team Roster</p>
        <span style="font-size:9px;background:#FEF3C7;color:#92400E;border-radius:4px;padding:1px 6px;font-family:Montserrat,sans-serif;font-weight:700">Demo data</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${mockTeam.map(member=>{
          const r = getRole(member.role)
          const myM = MISSIONS.filter(m=>m.owner.includes(member.role))
          const pct = myM.length>0?Math.round((member.done/myM.length)*100):0
          return `<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:12px">
            <div style="width:34px;height:34px;border-radius:50%;background:${r.color};display:flex;align-items:center;justify-content:center;font-size:11px;font-family:Montserrat,sans-serif;font-weight:700;color:#fff;flex-shrink:0">${member.initials}</div>
            <div style="flex:1;min-width:0">
              <p style="font-size:13px;font-family:Montserrat,sans-serif;font-weight:700;color:#111827">${member.name}</p>
              <p style="font-size:11px;color:#9CA3AF">${r.title}</p>
            </div>
            <div style="width:120px;flex-shrink:0">
              ${progressBar(pct,r.color,5)}
              <p style="font-size:9px;color:#9CA3AF;margin-top:3px">${member.done}/${myM.length} missions</p>
            </div>
          </div>`
        }).join('')}
      </div>
    </div>
  </div>`)
}

// ═══════════════════════════════════════════════════
//  NAVIGATION & ACTIONS
// ═══════════════════════════════════════════════════

function navTo(page) {
  CURRENT_PAGE = page
  CURRENT_MISSION_ID = null
  render()
  window.scrollTo({top:0,behavior:'smooth'})
}

function navToMission(id) {
  CURRENT_PAGE = 'mission-detail'
  CURRENT_MISSION_ID = id
  render()
  window.scrollTo({top:0,behavior:'smooth'})
}

function completeOnboarding() {
  if (!ONBOARD_ROLE) { alert('Please select a role'); return }
  setState(s=>({...s, onboarded:true, role:ONBOARD_ROLE, schoolName:ONBOARD_SCHOOL, lastActive:new Date().toISOString().slice(0,10)}))
  CURRENT_PAGE = 'dashboard'
  render()
}

function nextStep() {
  const m = MISSIONS.find(x=>x.id===CURRENT_MISSION_ID)
  if (!m) return
  const stepIdx = STATE.missionStepProgress[CURRENT_MISSION_ID] || 0
  if (stepIdx < m.steps.length - 1) {
    setState(s=>({...s, missionStepProgress:{...s.missionStepProgress,[m.id]:stepIdx+1}}))
  } else {
    // Complete mission
    const badgeId = BADGES.find(b=>b.missionId===m.id)?.id
    setState(s=>{
      const today = new Date().toISOString().slice(0,10)
      return {
        ...s,
        completedMissions: s.completedMissions.includes(m.id) ? s.completedMissions : [...s.completedMissions, m.id],
        earnedBadges: badgeId && !s.earnedBadges.includes(badgeId) ? [...s.earnedBadges, badgeId] : s.earnedBadges,
        streak: s.streak + 1,
        lastActive: today,
      }
    })
    CELEBRATION_MISSION = m
    render()
  }
}

function prevStep() {
  if (!CURRENT_MISSION_ID) return
  const stepIdx = STATE.missionStepProgress[CURRENT_MISSION_ID] || 0
  if (stepIdx > 0) {
    setState(s=>({...s, missionStepProgress:{...s.missionStepProgress,[CURRENT_MISSION_ID]:stepIdx-1}}))
  }
}

function toggleFocusMode() {
  setState(s=>({...s, focusMode:!s.focusMode}))
}

function updateSchoolName() {
  const val = document.getElementById('school-name-input')?.value || ''
  setState(s=>({...s, schoolName:val}))
}

function updateRole(id) { setState(s=>({...s, role:id})); render() }
function updatePhase(id) { setState(s=>({...s, phase:id})); render() }
function resetAll() { localStorage.removeItem(STORAGE_KEY); STATE=loadState(); CURRENT_PAGE='welcome'; ONBOARD_STEP=1; ONBOARD_ROLE=null; render() }

// ═══════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════

function render() {
  const app = document.getElementById('app')

  // Show celebration overlay
  if (CELEBRATION_MISSION) {
    const m = CELEBRATION_MISSION
    CELEBRATION_MISSION = null
    app.innerHTML = `
    <div class="celebration">
      <div style="text-align:center;max-width:360px;padding:32px">
        <div style="font-size:56px;margin-bottom:16px;animation:pop 0.4s ease-out">🏆</div>
        <h2 style="font-size:28px;font-family:Montserrat,sans-serif;font-weight:900;color:#fff;margin-bottom:8px">Mission Complete!</h2>
        <p style="color:rgba(255,255,255,0.55);font-size:13px;margin-bottom:8px">${m.title}</p>
        ${m.badge?`<div style="display:inline-flex;align-items:center;gap:8px;background:rgba(245,197,24,0.15);border:1px solid rgba(245,197,24,0.3);border-radius:999px;padding:6px 16px;margin:10px 0 24px">
          <span style="color:#F5C518;font-size:14px">🏅</span>
          <span style="color:#F5C518;font-family:Montserrat,sans-serif;font-weight:700;font-size:12px">${m.badge} badge earned</span>
        </div>`:'<div style="height:24px"></div>'}
        <br>
        <button class="btn-primary" onclick="navTo('dashboard')" style="width:100%;justify-content:center">Back to Dashboard</button>
      </div>
    </div>`
    return
  }

  let html = ''
  if (!STATE.onboarded) {
    if (CURRENT_PAGE === 'choose-role') html = renderChooseRole()
    else html = renderWelcome()
  } else {
    if (CURRENT_PAGE === 'dashboard')       html = renderDashboard()
    else if (CURRENT_PAGE === 'missions')   html = renderMissions()
    else if (CURRENT_PAGE === 'mission-detail') html = renderMissionDetail()
    else if (CURRENT_PAGE === 'resources')  html = renderResources()
    else if (CURRENT_PAGE === 'progress')   html = renderProgress()
    else if (CURRENT_PAGE === 'school-profile') html = renderSchoolProfile()
    else if (CURRENT_PAGE === 'team-view')  html = renderTeamView()
    else html = renderDashboard()
  }
  app.innerHTML = html
}

// Initial render
render()
</script>
</body>
</html>
